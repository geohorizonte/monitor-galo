name: Rotina Diaria - Noticias do Galo

on:
  schedule:
    # Roda automaticamente todos os dias. (17h no UTC equivale às 14h no horário de Brasília)
    - cron: '0 17 * * *'
  workflow_dispatch: # Permite que você rode manualmente clicando no botão "Run workflow"

permissions:
  contents: write # Dá permissão para o robô salvar os relatórios na pasta do repositório

jobs:
  executar-busca:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Relatório de Notícias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar Relatório no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md relatorios/
          git commit -m "🤖 Dossiê do Galo atualizado via automação" || echo "Nenhuma mudança para commitar"
          git push
