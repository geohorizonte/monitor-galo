name: Rotina Diaria - Noticias do Galo

on:
  schedule:
    # Executa diariamente às 17:00 UTC (14:00 no Horário de Brasília)
    - cron: '0 17 * * *'
  workflow_dispatch: # Permite rodar manualmente quando você quiser

jobs:
  executar-busca:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Relatório de Notícias
        run: python monitor.py

      - name: Salvar Relatório no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Bot"
          git add README.md relatorios/
          git commit -m "Relatório diário de notícias gerado com sucesso" || exit 0
          git push
